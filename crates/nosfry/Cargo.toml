[package]
name                   = "nosfry"
description            = "High-performance Nostr relay (strict NIP-01, LMDB storage)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
readme.workspace       = true
repository.workspace   = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
nosfry-core.workspace        = true
nosfry-lmdb.workspace        = true
axum.workspace               = true
bytes.workspace              = true
clap.workspace               = true
faster-hex.workspace         = true
foldhash.workspace           = true
futures-util.workspace       = true
getrandom.workspace          = true
http-body-util.workspace     = true
hyper                        = { workspace = true, features = ["client"] }
hyper-util.workspace         = true
negentropy.workspace         = true
rlimit.workspace             = true
secp256k1.workspace          = true
serde.workspace              = true
serde_json.workspace         = true
socket2.workspace            = true
thiserror.workspace          = true
tokio.workspace              = true
tokio-rustls.workspace       = true
tokio-util.workspace         = true
toml.workspace               = true
tower.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
url.workspace                = true
webpki-roots.workspace       = true
yawc.workspace               = true

# Embedded onion service (feature "onion").
arti-client   = { workspace = true, optional = true }
tor-cell      = { workspace = true, optional = true }
tor-hsservice = { workspace = true, optional = true }
tor-keymgr    = { workspace = true, optional = true }
tor-proto     = { workspace = true, optional = true }
tor-rtcompat  = { workspace = true, optional = true }
safelog       = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace     = true
nosfry-core          = { workspace = true, features = ["test-util"] }
flate2.workspace     = true
proptest.workspace   = true
secp256k1.workspace  = true
serde_json.workspace = true
sha2.workspace       = true
tempfile.workspace   = true

[features]
onion = ["dep:arti-client", "dep:tor-hsservice", "dep:tor-cell", "dep:tor-proto", "dep:tor-keymgr", "dep:tor-rtcompat", "dep:safelog"]
# Test-only: the Tor client the network test and the bridge example dial
# the onion listener through (precedent: nosfry-core's "test-util").
onion-e2e = ["onion", "arti-client/onion-service-client"]

[[test]]
name              = "onion"
required-features = ["onion-e2e"]

[[example]]
name              = "onion_bridge"
required-features = ["onion-e2e"]

[lints]
workspace = true

[[bin]]
name = "nosfry"
path = "src/main.rs"
doc  = false
