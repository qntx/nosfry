# nginx in front of nosfry; see guides/deployment.md. Goes in the http
# context (for example /etc/nginx/conf.d/nosfry.conf). Replace
# relay.example.com and the certificate paths.

# HTTP requests per client address: NIP-11, the landing page, NIP-86
# calls and WebSocket upgrades. Messages inside an open WebSocket are
# rate-limited by nosfry itself ([relay.rate_limits]).
limit_req_zone $binary_remote_addr zone=nosfry_http:10m rate=10r/s;

map $http_upgrade $nosfry_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The metrics endpoint is unauthenticated; never expose it.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=nosfry_http burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nosfry_connection;
        proxy_set_header Host $host;
        # Overwrite, never append: nosfry trusts the last value of
        # relay.real_ip_header = "X-Forwarded-For".
        proxy_set_header X-Forwarded-For $remote_addr;

        # Longer than relay.auto_ping_seconds (55), so idle WebSockets
        # are kept open by the relay's pings, not cut by nginx.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
