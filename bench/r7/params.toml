# Round 7 workload parameters — the single source of truth for run.py.
# Frozen after the pilot; hashed into run-meta.json for every run.

[paths]
bench      = "/bench"
results    = "/bench/results/r7"
work       = "/bench/work/r7"
harness    = "/bench/harness/target/release/nosfry-bench"
bin_dir    = "/bench/bin"
strfry_bin = "/bench/strfry-1.1.3/strfry"
wrappers   = "/bench/relays"
variants   = "/bench/variants"
mix        = "/bench/mix.json"
# Directory written by `gen`: events.jsonl, holdout.jsonl, params.json.
d2 = "/bench/corpus/d2"
# regular.jsonl / holdout-regular.jsonl are produced by `prep`.
regular         = "/bench/corpus/d2/regular.jsonl"
holdout_regular = "/bench/corpus/d2/holdout-regular.jsonl"
d1_corpus       = "/bench/corpus/nostr_vitor_startup_data.json.gz"
relaybench      = "/bench/relaybench/bin/relaybench"
strfry_pinned   = "/bench/strfry-pinned.sh"
build_info      = "/bench/results/build-info.txt"

[cores]
relay   = "0-3"
harness = "4-9"

[net]
port = 17777

[reps]
# 6 reps make [min, max] a >=96.9% distribution-free CI for the median.
default = 6

[w1]
relays       = ["nosfry-030", "nosfry-030+sliding", "strfry", "nostr-rs-0100"]
closed_conns = [1, 8, 32]
window       = 64
closed_secs  = 30
warmup_secs  = 10
open_conns   = 32
open_secs    = 60
# Absolute open-loop send rates per relay. Pilot closed-loop c32
# accepted/s: nosfry-030 7779, nosfry-030+sliding 6449, strfry 5973,
# nostr-rs-0100 1253. The shared rates are 0.25/0.5/0.75/0.9 x
# strfry's 5973 (the slower of the two primary systems) rounded down
# to 100; nostr-rs gets the same fractions of its own 1253 and is not
# compared at absolute rates.
open_rates = { "nosfry-030" = [1500, 3000, 4500, 5400], "nosfry-030+sliding" = [1500, 3000, 4500, 5400], "strfry" = [1500, 3000, 4500, 5400], "nostr-rs-0100" = [300, 600, 900, 1100] }

[w2]
relays  = ["nosfry-030", "strfry"]
conns   = [1, 8, 64]
secs    = 60
warmup  = 15
deflate = [false, true]
seed    = 1
# relayBench runs on the D1 corpus for continuity; one rep per relay.
d1_reps = 1

[w3]
relays    = ["nosfry-030", "nosfry-030+sliding", "strfry", "nostr-rs-0100"]
broadcast = [{ subs = 1000, rate = 100 }, { subs = 5000, rate = 20 }, { subs = 20000, rate = 5 }]
selective = [{ subs = 2000, rate = 500 }, { subs = 20000, rate = 500 }]
authors   = 200
secs      = 60
deflate   = [false, true]

[w4]
relays    = ["nosfry-030", "nosfry-030+sliding", "strfry", "nostr-rs-0100"]
conns     = [1000, 10000, 50000]
hold_secs = 30
deflate   = [false, true]

[w5]
reps         = 3
relays       = ["nosfry-030", "strfry"]
conns        = 8
query_secs   = 60
query_warm   = 15
open_conns   = 32
ingest_secs  = 60
ingest_rates = [3000]

[w6]
relays           = ["nosfry-030", "strfry"]
n                = 1_000_000
diff             = [0.1, 1.0, 10.0]
frame_size_limit = 60000
seed             = 1

[w7]
reps              = 1
relays            = ["nosfry-030", "strfry", "nostr-rs-0100"]
duration_secs     = 86400
sample_secs       = 60
publishers        = 8
rate              = 200
subscribers       = 200
churn_rate        = 10
slow_every_secs   = 60
neg_every_secs    = 10
vanish_every_secs = 60

[w8]
relays   = ["nosfry-030", "strfry", "nostr-rs-0100"]
cycles   = 50
rate     = 500
conns    = 8
seed     = 1
kill_min = 2.0
kill_max = 20.0

# Pre-registered nosfry-030 vs strfry comparisons. `metric` is the
# JSON path in the harness result written to rep<k>.json; `better`
# is the winning direction.
[primary]
P1 = { id = "P1", workload = "w1", scenario = "closed-c32", metric = "accepted_per_sec", better = "higher" }
P2 = { id = "P2", workload = "w1", scenario = "open-4500", metric = "ok_latency.p99_ms", better = "lower" }
P3 = { id = "P3", workload = "w2", scenario = "q-c8-plain-warm", metric = "queries.overall.latency.p50_ms", better = "lower" }
P4 = { id = "P4", workload = "w2", scenario = "q-c64-plain-warm", metric = "events_per_sec", better = "higher" }
P5 = { id = "P5", workload = "w3", scenario = "broadcast-5000-plain", metric = "latency_p50_ms", better = "lower" }
# Derived: relay_cpu_us_per_delivery = relay_cpu_secs / delivered * 1e6.
P6 = { id = "P6", workload = "w3", scenario = "broadcast-5000-plain", metric = "relay_cpu_us_per_delivery", better = "lower" }
P7 = { id = "P7", workload = "w4", scenario = "conns-10000-plain", metric = "kib_per_conn", better = "lower" }
P8 = { id = "P8", workload = "w4", scenario = "conns-10000-deflate", metric = "kib_per_conn", better = "lower" }

[pilot]
# `pilot wN`: one rep with these shortened timings.
reps      = 1
secs      = 10
warmup    = 3
hold_secs = 5
