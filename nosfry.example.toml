# nosfry relay configuration — every key shown with its default.
# Copy to nosfry.toml (or pass --config / set NOSFRY_CONFIG).
# SIGHUP reloads this file without restarting; sections marked
# "restart-only" keep their startup values until the next start.
#
# Logging is RUST_LOG-based instead of strfry's relay.logging.*:
#   strfry logging.invalidEvents → RUST_LOG=info,nosfry::ingest=debug
#     (every OK frame sent, accept or reject, plus relay-sent CLOSED
#     — a superset of strfry's rejected-only output)
#   dumpInAll/dumpInEvents/dumpInReqs → nosfry::inbound=trace
#     (every inbound text message, already bounded by
#     max_websocket_payload_size)
#   dbScanPerf → nosfry::scan=debug
#     (one line per finished stored REQ scan or COUNT)

[db] # restart-only
# LMDB environment directory.
path = "./nosfry-db"
# Map size in bytes (10 TiB default).
map_size = 10995116277760
# Maximum concurrent read transactions.
max_readers = 256
# Disable OS read-ahead on the LMDB map (MDB_NORDAHEAD). Leave off: it cuts
# query throughput by about 10x. If the database outgrows RAM on a filesystem
# with large read-ahead (btrfs uses at least 4 MiB), lower the filesystem's
# read_ahead_kb (e.g. to 128) instead.
no_read_ahead = false

[events]
# Maximum canonical event size in bytes.
max_event_size = 65536
# Reject events this many seconds in the future.
reject_events_newer_than_seconds = 900
# Reject events this many seconds in the past.
reject_events_older_than_seconds = 94608000
# Reject ephemeral events this many seconds in the past.
reject_ephemeral_events_older_than_seconds = 60
# Maximum tags per event.
max_num_tags = 2000
# Maximum tag value size in bytes.
max_tag_val_size = 1024

[relay]
# Listen address and port (restart-only).
bind = "127.0.0.1"
port = 7777
# The relay's canonical ws:// / wss:// URL. Clients echo it in the
# AUTH event's "relay" tag and name it in a NIP-62 request to vanish.
# Empty disables AUTH: restricted kinds are stored but never served
# and protected events are rejected (vanish requests to ALL_RELAYS are
# still honored).
service_url = ""
# Raise the soft open-file limit at startup up to this value, capped by
# the hard limit; 0 leaves it unchanged (restart-only).
nofiles = 1000000
# Header carrying the real client IP (empty = socket address). The
# last comma-separated value is trusted — set this only behind a proxy
# that sets or appends the header.
real_ip_header = ""
# Maximum inbound WebSocket payload in bytes.
max_websocket_payload_size = 131072
# WebSocket ping interval in seconds; at least 1 (unlike strfry, 0
# does not disable pings — it also bounds writes and idle closes).
auto_ping_seconds = 55
# Set SO_KEEPALIVE on accepted sockets with OS default timings
# (strfry enableTcpKeepalive). Reloadable — applies to connections
# accepted after the change.
tcp_keepalive = false
# Pending outbound bytes above which a connection is closed (1008).
max_pending_outbound_bytes = 33554432
# Process-wide pending outbound byte budget (restart-only; 0 =
# unlimited). Over budget, scans pause only on connections already
# more than one chunk behind; caught-up readers keep scanning.
max_pending_outbound_bytes_total = 1073741824
# Process-wide budget for sealed negentropy sync storages, accounted
# at 40 bytes per scanned record (restart-only; 0 = unlimited).
max_sync_memory_bytes = 1073741824
# Process-wide budget for live subscriptions (restart-only; 0 =
# unlimited). Every REQ is charged the Filter::approx_bytes sum of
# its filters — the compiled filter plus its monitor index entries —
# and refused CLOSED `blocked: subscription capacity exhausted` over
# budget; CLOSE and disconnects release the charge.
max_subscription_bytes_total = 1073741824
# Maximum simultaneous WebSocket connections (0 = unlimited).
max_connections = 0
# Maximum simultaneous WebSocket connections per client IP (0 =
# unlimited). IPv4 counts per address; IPv6 per /64 prefix.
max_connections_per_ip = 128
# Serve GET /metrics (Prometheus text exposition format) on the relay
# port. Unauthenticated — keep it behind a reverse proxy or firewall
# (restart-only).
metrics = false
# Per-slice stored-scan budget in microseconds (restart-only).
query_timeslice_budget_microseconds = 10000

[relay.limits]
# Maximum filters per REQ.
max_req_filter_size = 200
# Maximum open subscriptions per connection.
max_subs_per_connection = 200
# Per-filter limit cap for stored scans (restart-only — readers hold
# it for the process lifetime).
max_filter_limit = 500
# Index entries a COUNT scan may examine before answering
# `"approximate": true`; 0 disables COUNT (restart-only).
max_filter_limit_count = 1000000
# Records a negentropy sync may hold before answering
# `blocked: too many query results`; 0 disables NEG-OPEN
# (restart-only).
max_sync_events = 1000000
# Maximum `#x` conditions per filter.
max_tags_per_filter = 3

[relay.filter_validation]
# strfry `relay.filterValidation` parity: refuse REQ/COUNT messages
# whose filters violate the rules below (CLOSED `blocked:`; NEG-OPEN
# is exempt). Reloads on SIGHUP for new connections.
enabled = false
# Filters allowed in one REQ, inclusive.
max_filters_per_req = 3
# Filters required in one REQ, inclusive.
min_filters_per_req = 1
# Kinds allowed per filter.
max_kinds_per_filter = 3
# Kinds a filter may list; empty allows every kind. When non-empty a
# filter without `kinds` is refused (strfry lets it match every kind).
allowed_kinds = []
# Require each filter to pin exactly one `authors` entry or exactly
# one `#p`/`#e` value.
require_author_or_tag = false

[relay.rate_limits]
# Per-connection token buckets; over-limit EVENTs get `OK false
# rate-limited:`, over-limit REQs get `CLOSED rate-limited:`. A
# *_per_second of 0 disables that bucket.
events_per_second = 20
events_burst      = 100
reqs_per_second   = 20
reqs_burst        = 100
# Shared per-client-address buckets (IPv4 per address, IPv6 per /64):
# every connection of one address draws from the same bucket.
ip_events_per_second = 100
ip_events_burst      = 500
ip_reqs_per_second   = 100
ip_reqs_burst        = 500

[relay.write_policy]
# strfry-compatible write-policy plugin: each verified event is sent
# to `/bin/sh -c <plugin>` as one JSON line and the plugin answers
# accept/reject/shadowReject. Empty disables the plugin.
plugin = ""
# Seconds the plugin has to answer before the event is rejected with
# `error: internal error` and the plugin process is restarted.
timeout_seconds = 10

[relay.auth]
# Kinds served only to authenticated readers (strfry default: DMs and
# gift wraps).
restricted_read_kinds = [4, 1059]
# Serve restricted kinds only to authenticated pubkeys involved in the
# event (author or "p" tag); false serves them to any authed reader.
restrict_read_to_involved = true

[relay.management]
# NIP-86 management API: POST / with application/nostr+json+rpc and a
# NIP-98 auth event from one of these pubkeys. Empty = endpoint off.
# The `u` check needs [relay] service_url.
admins = []

[relay.threads] # restart-only
# Stored-scan reader threads.
readers = 3
# Live-monitor shard threads.
monitors = 3

[relay.compression]
# Negotiate permessage-deflate. On by default: yawc bounds the
# inflated size of an inbound message by max_websocket_payload_size.
enabled = true
# Keep the LZ77 sliding window between messages. false (default) =
# no context takeover either direction, deflate state shared from a
# server-wide pool, a few KiB per connection, at 18-52% more bytes and
# ~25% more CPU per compressed message than the sliding window.
# true = strfry's default: per-connection deflate state (~370 KiB once
# a message was compressed) for the better ratio and lower CPU — for
# relays bound by bandwidth or CPU rather than connection count.
sliding_window = false

[relay.info]
# NIP-11 relay information fields. `pubkey` and `self` must be
# 64-char lowercase hex (convert an npub to hex first).
name             = "nosfry"
description      = ""
pubkey           = ""
contact          = ""
icon             = ""
banner           = ""
self             = ""
terms_of_service = ""
privacy_policy   = ""
# Replace the computed supported_nips list verbatim.
# supported_nips = [1, 11]
