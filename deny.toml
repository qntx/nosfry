# cargo-deny configuration.
#
# Hooked into CI via the shared `qntx/workflows/ci-rust.yml` runner. Run
# locally with:
#
#   cargo install cargo-deny --locked
#   cargo deny check
#

[graph]
all-features = true

[advisories]
db-path      = "$CARGO_HOME/advisory-dbs"
db-urls      = ["https://github.com/RustSec/advisory-db"]
yanked       = "deny"
unmaintained = "all"
unsound      = "all"
# Each ignore names one advisory, why it cannot be fixed by an upgrade,
# what it reaches, and the date it was last reviewed. cargo-deny 0.20
# (the version CI runs) has no `expiry` field, so the review date lives
# in the reason; drop the entry once the reason no longer holds.
ignore = [{ id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational, no patched version). Reached through worker 0.8.7 in nosfry-worker, which builds for wasm32 only and is not published, and through iroh 1.4.1 (iroh feature, off by default) via netwatch -> wmi, a cfg(windows)-only dependency: no Linux, macOS or wasm32 build of nosfry links chrono. worker 0.9.0 still requires chrono unconditionally (cloudflare/workers-rs#77). Reviewed 2026-11-22; revisit by 2027-02-22 or when worker and wmi drop chrono." }, { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite 3.53.2 in libsqlite3-sys 0.38.2 (CVE-2026-119375: a database opened together with a sibling -wal file of a different page size can return uninitialized page-cache memory; local vector, the attacker must have written both files). Held back because tor-dirmgr 0.48.0 (Arti, onion feature) requires rusqlite <0.41 and the workspace can link only one libsqlite3-sys; the fix ships in libsqlite3-sys 0.39 with rusqlite 0.41. What links SQLite: (1) nosfry built with the off-by-default onion feature, through Arti's directory cache <relay.onion.state_dir>/cache/dir.sqlite3 (static-sqlite, bundled): the relay alone creates and writes it inside the 0700 state_dir it refuses to start without, tor-dirmgr never enables WAL mode, and network input (directory documents) reaches SQLite only as bound parameters, so no remote peer can supply the database or -wal file the bug needs; (2) nosfry-sql's optional rusqlite feature (bundled), used by nosfry-testkit and the nosfry-sql and nosfry-worker native tests on databases they create themselves; a downstream user of that published feature is exposed only when opening a database and -wal written by a less trusted party. The default native nosfry binary and the wasm32 Workers bundle link no SQLite. Tracked in https://github.com/qntx/nosfry/issues/116: drop with the rusqlite pin once an Arti release allows rusqlite >=0.41. Reviewed 2026-11-22; revisit by 2026-12-22." }, { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 Marvin timing side channel on RSA private-key operations (decryption and signing). Reached only through Arti (onion feature, off by default) via tor-llcrypto and tor-key-forge/ssh-key-fork-arti. An onion service and an Arti client hold no RSA private key: their identity, descriptor and circuit keys are ed25519/x25519, and RSA is used only to verify signatures from relay and directory-authority RSA public keys, which leaks nothing about a private key. RSA signing exists in Arti for relay operation, which nosfry never runs. The default build does not link rsa. Tracked in https://github.com/qntx/nosfry/issues/116: drop when Arti moves to rsa 0.10. Reviewed 2026-11-22; revisit by 2026-12-22." }, { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained (informational, no patched version). Reached only through Arti (onion feature, off by default), which uses it outside tests only to format durations and timestamps in its log messages and status values; directory documents from the network are parsed by tor-netdoc's own parsers, not humantime. The default build does not link humantime. Tracked in https://github.com/qntx/nosfry/issues/116: drop when Arti replaces it. Reviewed 2026-11-22; revisit by 2026-12-22." }, { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (informational, no patched version). A compile-time proc-macro reached through Arti (onion feature, off by default) via tor-rtcompat and pwd-grp, and through iroh 1.4.1 (iroh feature, off by default) via netwatch -> netdev -> netlink-packet-core; it emits code at build time and is not linked into the binary. Tracked in https://github.com/qntx/nosfry/issues/116: drop when Arti and netlink-packet-core replace it. Reviewed 2026-11-22; revisit by 2026-12-22." }]

[licenses]
unused-allowed-license = "warn"
allow                  = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold   = 0.93

# Per-crate licence exceptions for Arti's mandatory dependencies (onion
# feature, off by default); both licences are OSI-approved and
# permissive. Tracked in https://github.com/qntx/nosfry/issues/116;
# reviewed 2026-11-22, revisit by 2026-12-22.
[[licenses.exceptions]]
crate = "async_executors"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

# Per-crate licence exceptions for iroh-relay's browser WebSocket client
# (iroh feature, off by default). The Unlicense is OSI-approved and
# permissive. iroh-relay 1.4.1 depends on ws_stream_wasm only under
# cfg(all(target_family = "wasm", target_os = "unknown")), so these
# crates are in the lockfile but no native build compiles or links them.
# Reviewed 2026-11-23, revisit with every iroh bump.
[[licenses.exceptions]]
crate = "ws_stream_wasm"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "pharos"
allow = ["Unlicense"]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
