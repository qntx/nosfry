# Version updates. A release must be at least seven days old before
# Dependabot proposes it (the repository's supply-chain rule); security
# updates are not delayed. A maintainer reviews each Dependabot pull
# request (changelog read) and adds it to the merge queue manually.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Held at 0.40.x: tor-dirmgr 0.48 (Arti, onion feature) requires
      # rusqlite >=0.36, <0.41 and the workspace links one
      # libsqlite3-sys. Drop this with the pin (qntx/nosfry#116).
      - dependency-name: "rusqlite"
        versions: [">= 0.41"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
