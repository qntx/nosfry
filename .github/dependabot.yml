# Version updates. A release must be at least seven days old before
# Dependabot proposes it (the repository's supply-chain rule); security
# updates are not delayed. The Dependabot workflow merges green patch and
# minor updates through the merge queue.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
