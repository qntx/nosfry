name: Audit

# Advisories appear without any change to the repository (RUSTSEC-2026-0543
# turned main red with no commit), so check the dependency graph daily
# under the deny.toml policy. cargo-deny is the only reader: it resolves
# the graph for every feature and target, and deny.toml is the one place
# an advisory is accepted, with its reachability and review date.
# cargo-audit scans every Cargo.lock entry instead, including optional
# dependencies nothing activates, and keeps its own ignore list.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --all-features
