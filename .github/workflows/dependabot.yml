name: Dependabot

# Daily sweep that merges green Dependabot PRs (patch and minor only)
# through the merge queue. It authenticates as a GitHub App: a merge or
# enqueue made with GITHUB_TOKEN triggers no workflow, so the merge queue
# would never run its required checks and push CI would never run on the
# result. Without the App credentials the job fails and merges nothing.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-sweep
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App key is an environment secret, readable only by jobs that
    # run from main in this environment.
    environment: dependabot-merge
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
          permission-statuses: read
          permission-workflows: write
          permission-merge-queues: write
      - uses: qntx/workflows/actions/ops-dependabot-enable@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          custom-token: "true"
          merge-method: squash
          allow-patch: "true"
          allow-minor: "true"
          allow-major: "false"
          exempt-labels: do-not-merge,work-in-progress
