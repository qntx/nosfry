name: CI

# The full local gate from AGENTS.md. Pull requests run it on their merge
# ref, the merge queue runs it on the exact commit that lands on main, a
# push to main runs it again, and release.yml calls it on the tagged
# commit before anything is built. Branch protection requires the single
# `gate` job, which fails unless every other job succeeded.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
    with:
      deny: true
      doc: true
      package-check: true
      each-feature: true

  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nightly: ${{ steps.pin.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: echo "nightly=$(cat .github/nightly-toolchain)" >> "$GITHUB_OUTPUT"

  nightly-lint:
    name: nightly fmt and clippy
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NIGHTLY: ${{ needs.toolchain.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly rustfmt and clippy
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: nightly-${{ needs.toolchain.outputs.nightly }}
      # group_imports and other rustfmt.toml options are nightly-only:
      # the pinned toolchain in the ci job silently skips them.
      - run: cargo +"$NIGHTLY" fmt --all -- --check
      - run: cargo +"$NIGHTLY" clippy --workspace --all-targets --all-features -- -D warnings

  wasm32:
    name: wasm32 check and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32
      - run: cargo check -p nosfry-core -p nosfry-sql -p nosfry-worker --target wasm32-unknown-unknown
      - run: cargo clippy -p nosfry-worker --target wasm32-unknown-unknown -- -D warnings

  fuzz:
    needs: toolchain
    uses: qntx/workflows/.github/workflows/ci-rust-fuzz.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
    with:
      max-total-time: 60
      rust-version: ${{ needs.toolchain.outputs.nightly }}

  conformance-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: conformance-native
      - name: Run the conformance suite against the native edition
        run: crates/nosfry-conformance/run.sh native
      - name: Run the conformance suite through a unix-socket listener
        run: crates/nosfry-conformance/run.sh native-unix

  conformance-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the wasm32 target and worker-build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.8.7 --locked
      - name: Run the conformance suite against the Workers edition
        env:
          CC_wasm32_unknown_unknown: clang
        run: crates/nosfry-conformance/run.sh worker
      - name: Report the worker bundle size
        run: |
          WASM="crates/nosfry-worker/build/index_bg.wasm"
          {
            echo "worker bundle"
            echo "- raw: $(stat -c%s "$WASM") bytes"
            echo "- gzip: $(gzip -c "$WASM" | wc -c) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

  default-features:
    name: default build has no Arti
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: default-features
      - name: Assert the default build links no Arti crates
        run: |
          if cargo tree -p nosfry -e normal --prefix none | grep -E '^(arti-|tor-)'; then
            echo "::error::Arti crates in nosfry's default dependency graph; the onion feature must be the only path to them"
            exit 1
          fi
      - run: cargo clippy -p nosfry --all-targets -- -D warnings
      - run: cargo test -p nosfry --lib

  gate:
    if: always()
    needs: [taplo, ci, toolchain, nightly-lint, wasm32, fuzz, conformance-native, conformance-worker, default-features]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
