name: Release

# One pipeline for every release artifact. A pushed vX.Y.Z tag runs the
# full CI gate on the tagged commit, builds and verifies the binaries and
# the container image, and only then publishes, from the most to the
# least reversible step: a draft GitHub release with attestations, the
# image, crates.io, and finally the public release. A manual run
# (workflow_dispatch) is a dry run: it builds and verifies everything and
# publishes nothing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Linux binaries link against this glibc version or older (Debian 11,
  # Ubuntu 20.04 and newer); cargo-zigbuild supplies the old symbols.
  GLIBC_FLOOR: "2.31"
  ZIG_VERSION: 0.17.1
  CARGO_ZIGBUILD_VERSION: 0.24.1
  CARGO_CYCLONEDX_VERSION: 0.5.10
  IMAGE: ghcr.io/qntx/nosfry

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nosfry") | .version')"
          publish=false
          if [ "$EVENT" = push ]; then
            [ "$REF" = "refs/tags/v$version" ] \
              || { echo "::error::tag $REF does not match workspace version $version"; exit 1; }
            grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no dated [$version] section"; exit 1; }
            publish=true
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "nosfry $version, publish: $publish" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    needs: [gate, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, zig: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, zig: true }
          - { target: aarch64-apple-darwin, os: macos-15, zig: false }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      ZIG: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add "$TARGET"
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Install release tools
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
          if [ "$ZIG" = true ]; then
            cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
          fi
      - name: Build
        run: |
          set -euo pipefail
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked -p nosfry --target "$TARGET.$GLIBC_FLOOR"
            .github/scripts/glibc-floor.sh "target/$TARGET/release/nosfry" "$GLIBC_FLOOR"
          else
            cargo build --release --locked -p nosfry --target "$TARGET"
          fi
      - name: Package
        run: |
          set -euo pipefail
          name="nosfry-$VERSION-$TARGET"
          mkdir -p "dist" "$name"
          cp "target/$TARGET/release/nosfry" LICENSE-APACHE LICENSE-MIT README.md CHANGELOG.md nosfry.example.toml "$name/"
          tar czf "dist/$name.tar.gz" "$name"
          cargo cyclonedx --manifest-path crates/nosfry/Cargo.toml --format json \
            --spec-version 1.5 --target "$TARGET" --override-filename "$name.cdx"
          mv "crates/nosfry/$name.cdx.json" dist/
          (cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256" && shasum -a 256 -c "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke ${{ matrix.target }} ${{ matrix.image || matrix.os }}
    needs: [plan, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, image: "debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, image: "debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, image: "ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, image: "debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, image: "debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, image: "ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6" }
          - { target: aarch64-apple-darwin, os: macos-15 }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      SMOKE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: Verify the checksum and unpack
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 -c "nosfry-$VERSION-$TARGET.tar.gz.sha256"
          tar xzf "nosfry-$VERSION-$TARGET.tar.gz"
      - name: Start the relay
        run: |
          set -euo pipefail
          if [ -n "$SMOKE_IMAGE" ]; then
            docker run --rm -v "$PWD:/w:ro" -w /w "$SMOKE_IMAGE" \
              bash .github/scripts/release-smoke.sh "dist/nosfry-$VERSION-$TARGET" "$VERSION"
          else
            .github/scripts/release-smoke.sh "dist/nosfry-$VERSION-$TARGET" "$VERSION"
          fi

  image:
    name: image ${{ matrix.platform }}
    needs: [gate, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, arch: arm64 }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: nosfry:smoke
      - name: Smoke-test the image
        run: .github/scripts/image-smoke.sh nosfry:smoke "$VERSION"
      - if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.plan.outputs.publish == 'true'
        id: push
        name: Push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          echo "$DIGEST" >"digests/$ARCH"
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs: [plan, smoke, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest the x86_64 Linux SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/nosfry-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: dist/nosfry-${{ env.VERSION }}-x86_64-unknown-linux-gnu.cdx.json
      - name: Attest the aarch64 Linux SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/nosfry-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz
          sbom-path: dist/nosfry-${{ env.VERSION }}-aarch64-unknown-linux-gnu.cdx.json
      - name: Attest the macOS SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/nosfry-${{ env.VERSION }}-aarch64-apple-darwin.tar.gz
          sbom-path: dist/nosfry-${{ env.VERSION }}-aarch64-apple-darwin.cdx.json
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >notes.md
          cat .github/release-verify.md >>notes.md
          (cd dist && cat ./*.sha256 >SHA256SUMS)
          gh release create "v$VERSION" --draft --verify-tag --title "v$VERSION" \
            --notes-file notes.md dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/*.cdx.json

  image-publish:
    needs: [plan, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: index
        name: Tag the multi-arch index
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          major="${VERSION%%.*}"
          tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:$minor" -t "$IMAGE:$major")
          case "$VERSION" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  crates:
    needs: [plan, image-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # crates.io trusted publishing: each crate trusts this workflow in this
    # environment, and the token lives only for this job.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Dependency order; cargo publish waits until each crate is in the
      # index before the next one resolves it.
      - name: Publish nosfry-core, nosfry-lmdb, nosfry
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for p in nosfry-core nosfry-lmdb nosfry; do
            cargo publish --locked -p "$p"
          done

  publish:
    needs: [plan, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          latest=true
          case "$VERSION" in *-*) latest=false ;; esac
          gh release edit "v$VERSION" --draft=false "--latest=$latest"
