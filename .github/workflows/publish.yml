name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
    with:
      packages: "nosfry-core nosfry-lmdb nosfry"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
