[package]
name    = "nosfry-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13", features = ["arbitrary-derive"] }
arbitrary     = "1.5"
serde_json    = "1.0.151"
secp256k1     = { version = "0.33.1", default-features = false, features = ["std"] }
faster-hex    = "1.0"

[dependencies.nosfry-core]
path = "../crates/nosfry-core"

# Isolated from the parent workspace so the main gates never see libFuzzer.
[workspace]
members = ["."]

[[bin]]
name  = "client_message"
path  = "fuzz_targets/client_message.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "filter_parse"
path  = "fuzz_targets/filter_parse.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "packed_record"
path  = "fuzz_targets/packed_record.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "event_roundtrip"
path  = "fuzz_targets/event_roundtrip.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "monitor_differential"
path  = "fuzz_targets/monitor_differential.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "session_sequence"
path  = "fuzz_targets/session_sequence.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "filter_roundtrip"
path  = "fuzz_targets/filter_roundtrip.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "nip98_authorize"
path  = "fuzz_targets/nip98_authorize.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "policy_response"
path  = "fuzz_targets/policy_response.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "relay_url"
path  = "fuzz_targets/relay_url.rs"
test  = false
doc   = false
bench = false
